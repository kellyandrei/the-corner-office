<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="The desk where executives think clearly. Dump everything. Your Chief of Staff sorts it." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function () {
        var t = localStorage.getItem("co_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        document.body && (document.body.style.background = t === "dark" ? "#1a1410" : "#F4F1EA");
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #1a1410; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
